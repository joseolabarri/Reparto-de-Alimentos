<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reparto de alimentos · Parroquia de Santa Matilde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F4F0;
    --surface:#FFFFFF;
    --ink:#1E2A32;
    --ink-soft:#616D73;
    --ink-faint:#8A939A;
    --line:#E4E2DB;
    --line-soft:#EFEEE9;
    --primary:#2E6E68;
    --primary-dark:#245751;
    --primary-tint:#E8F1EF;
    --warn:#B85C1B;
    --warn-tint:#FBEEE2;
    --warn-line:#EBD3BC;
    --danger:#A23B32;
    --radius:14px;
    --shadow:0 1px 2px rgba(30,42,50,.04),0 10px 30px rgba(30,42,50,.05);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink)}
  a{color:var(--primary)}
  .serif{font-family:'Fraunces',Georgia,serif}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:.45em;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:.55em 1em;border-radius:10px;font-weight:500;line-height:1.2;
    transition:background .12s ease,border-color .12s ease,color .12s ease,box-shadow .12s ease;
  }
  .btn:hover{background:var(--line-soft)}
  .btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{background:var(--line-soft);color:var(--ink)}
  .btn.danger{color:var(--danger);border-color:transparent;background:transparent}
  .btn.danger:hover{background:#F7ECEA}
  .btn.small{padding:.4em .75em;font-size:14px;border-radius:8px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .icon{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100dvh;display:grid;place-items:center;padding:24px}
  .login-card{
    width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);
    border-radius:18px;padding:40px 34px;box-shadow:var(--shadow);
  }
  .login-mark{font-family:'Fraunces',serif;font-size:15px;color:var(--primary)}
  .login-card h1{font-family:'Fraunces',serif;font-size:28px;margin:6px 0 6px;font-weight:500}
  .login-card p.sub{color:var(--ink-soft);margin:0 0 26px;font-size:15px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13.5px;font-weight:500;color:var(--ink-soft);margin-bottom:7px}
  .field input{width:100%;padding:.72em .8em;border:1px solid var(--line);border-radius:10px;background:#fff}
  .field input:focus,.row-input:focus,textarea:focus,.date-input:focus,.search-bar input:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint)
  }
  .form-error{color:var(--danger);font-size:14px;margin:2px 0 16px;min-height:1.2em}

  /* ---------- App shell ---------- */
  .app-root{max-width:1080px;margin:0 auto;padding:0 24px 96px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:26px 0 20px;gap:16px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;line-height:1.18}
  .brand .name{font-family:'Fraunces',serif;font-size:24px;font-weight:500}
  .brand .place{font-size:14px;color:var(--ink-soft)}
  .topbar .who{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--ink-soft)}

  .alert-banner{
    display:none;align-items:center;gap:12px;width:100%;
    background:var(--warn-tint);border:1px solid var(--warn-line);color:#7A3E12;
    border-radius:12px;padding:14px 16px;margin-bottom:18px;cursor:pointer;font-size:15px;
  }
  .alert-banner.show{display:flex}
  .alert-banner .icon{stroke:#B85C1B}
  .alert-banner strong{font-weight:600;color:#5E2F0C}

  .tabs-wrap{position:sticky;top:0;z-index:20;background:var(--paper);
    border-bottom:1px solid var(--line);margin-bottom:30px;
    box-shadow:0 8px 14px -12px rgba(30,42,50,.12)}
  .tabs{display:flex;gap:6px}
  .tab{
    border:none;background:none;padding:14px 16px;color:var(--ink-soft);font-weight:500;font-size:15.5px;
    border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
  .tab .count{font-size:12px;background:var(--warn);color:#fff;border-radius:20px;padding:1px 7px;margin-left:6px;font-weight:600;vertical-align:1px}

  .view-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .view-head h2{font-family:'Fraunces',serif;font-size:26px;font-weight:500}
  .view-head .actions{display:flex;gap:8px;flex-wrap:wrap}
  .muted{color:var(--ink-soft)}

  /* ---------- Reparto list (una sola tarjeta con filas) ---------- */
  .list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .list-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:18px 22px;cursor:pointer;transition:background .12s ease;
  }
  .list-row + .list-row{border-top:1px solid var(--line-soft)}
  .list-row:hover{background:#FAFAF8}
  .list-row .meta .date{font-family:'Fraunces',serif;font-weight:500;font-size:19px;letter-spacing:.005em}
  .list-row .meta .stat{font-size:14px;color:var(--ink-soft);margin-top:3px}
  .list-row .row-actions{display:flex;gap:2px;flex:none;align-items:center}
  .list-row .chev{color:var(--ink-faint)}

  .empty{
    text-align:center;color:var(--ink-soft);background:var(--surface);
    border:1px dashed var(--line);border-radius:var(--radius);padding:56px 24px;
  }
  .empty h3{font-family:'Fraunces',serif;font-weight:500;font-size:21px;color:var(--ink);margin-bottom:8px}

  /* ---------- Detalle (lectura) ---------- */
  .back{margin-bottom:14px;margin-left:-8px}
  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding-bottom:22px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .detail-date{font-family:'Fraunces',serif;font-size:31px;font-weight:500;line-height:1.1}
  .detail-sub{color:var(--ink-soft);font-size:14.5px;margin-top:6px}
  .detail-actions{display:flex;gap:8px;flex-wrap:wrap}

  .block{padding:26px 0;border-bottom:1px solid var(--line-soft)}
  .block:last-child{border-bottom:none}
  .block-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .block-head h3{font-size:15px;font-weight:600;letter-spacing:.01em}
  .block-head .tag{font-size:13px;font-weight:600;color:var(--primary);background:var(--primary-tint);
    border-radius:20px;padding:2px 10px}
  .block-head .totals{margin-left:auto;font-size:13.5px;color:var(--ink-soft)}

  .namecols{columns:3;column-gap:40px}
  .nameitem{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    break-inside:avoid;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .nameitem .nm{font-size:15.5px}
  .nameitem .pc{font-variant-numeric:tabular-nums;color:var(--ink-faint);font-size:14px;flex:none}
  @media(max-width:900px){.namecols{columns:2}}
  @media(max-width:600px){.namecols{columns:1}}

  .noalta-list{display:flex;flex-direction:column;gap:16px;max-width:72ch}
  .noalta-item .noalta-top{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
  .noalta-item .nm{font-size:15.5px;font-weight:500}
  .noalta-item .pc{color:var(--ink-faint);font-size:14px;flex:none}
  .noalta-item .obs{color:var(--ink-soft);font-size:14.5px;margin-top:4px;line-height:1.6}

  .freetext{max-width:72ch;line-height:1.75;color:var(--ink);white-space:normal}

  /* ---------- Editor ---------- */
  .editor{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 28px 24px;box-shadow:var(--shadow)}
  .editor h2{font-family:'Fraunces',serif;font-weight:500;font-size:25px;margin-bottom:4px}
  .editor .lead{color:var(--ink-soft);font-size:14.5px;margin-bottom:26px}
  fieldset{border:none;padding:0;margin:0 0 30px}
  fieldset > legend{font-size:15.5px;font-weight:600;padding:0;margin-bottom:4px}
  fieldset > .hint{font-size:13px;color:var(--ink-soft);margin-bottom:14px}
  .date-input{padding:.62em .72em;border:1px solid var(--line);border-radius:10px;background:#fff;max-width:220px}
  .rows{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
  .entry{display:flex;gap:9px;align-items:flex-start}
  .entry .row-input{flex:1 1 auto;min-width:0;padding:.6em .75em;border:1px solid var(--line);border-radius:10px;background:#fff}
  .entry .personas{width:78px;flex:none;padding:.6em .5em;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center}
  .entry.with-note{flex-wrap:wrap}
  .entry.with-note .obs{flex:1 1 100%;padding:.6em .75em;border:1px solid var(--line);border-radius:10px;background:#fff;resize:vertical;min-height:40px;line-height:1.5}
  .entry .rm{flex:none;color:var(--ink-faint);border:none;background:none;padding:9px;border-radius:8px;line-height:0}
  .entry .rm:hover{background:#F7ECEA;color:var(--danger)}
  .col-label{display:flex;gap:9px;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;padding:0 2px}
  .col-label .l-name{flex:1}
  .col-label .l-num{width:78px;flex:none;text-align:center}
  .col-label .l-sp{width:35px;flex:none}
  textarea.incidencias{width:100%;min-height:100px;padding:.7em .8em;border:1px solid var(--line);border-radius:10px;background:#fff;resize:vertical;line-height:1.6}
  .editor-foot{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line-soft);padding-top:20px}
  .editor-foot .spacer{flex:1}

  /* ---------- Panels / Personas / Análisis ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:22px}
  .search-bar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .search-bar .field{margin:0}
  .search-bar .field.grow{flex:1 1 260px}
  .search-bar .field input,.search-bar .field .date-input{width:100%;padding:.65em .75em;border:1px solid var(--line);border-radius:10px;background:#fff}
  .range{display:flex;gap:12px}
  .range .field{margin:0}

  .ficha .fname{font-family:'Fraunces',serif;font-size:26px;font-weight:500;margin-bottom:18px}
  .stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .stat-card{background:var(--paper);border:1px solid var(--line-soft);border-radius:12px;padding:16px 20px;min-width:132px}
  .stat-card .n{font-family:'Fraunces',serif;font-size:34px;font-weight:500;line-height:1}
  .stat-card .n.warn{color:var(--warn)}
  .stat-card .k{font-size:13px;color:var(--ink-soft);margin-top:8px}
  .date-list{list-style:none;padding:0;margin:14px 0 0;columns:3;column-gap:40px}
  .date-list li{padding:8px 0;border-bottom:1px solid var(--line-soft);break-inside:avoid;font-size:15px}
  @media(max-width:820px){.date-list{columns:2}}
  @media(max-width:560px){.date-list{columns:1}}

  .alert-card{display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:var(--warn-tint);border:1px solid var(--warn-line);border-radius:12px;padding:15px 18px;margin-bottom:10px}
  .alert-card .name{font-weight:600;color:#5E2F0C;font-size:16px}
  .alert-card .runs{font-size:13px;color:#7A3E12;margin-top:3px}
  .alert-card .streak{font-family:'Fraunces',serif;font-size:28px;font-weight:500;color:var(--warn);flex:none;text-align:right}
  .alert-card .streak small{font-family:'Inter';font-size:11px;font-weight:500;display:block;color:#7A3E12}

  table.rank{width:100%;border-collapse:collapse;font-size:15px}
  table.rank th{text-align:left;font-weight:500;color:var(--ink-soft);font-size:13px;padding:8px 12px;border-bottom:1px solid var(--line)}
  table.rank td{padding:11px 12px;border-bottom:1px solid var(--line-soft)}
  table.rank td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  table.rank tr:hover td{background:var(--paper)}
  .rank-bar{height:7px;border-radius:4px;background:var(--primary);opacity:.85;display:inline-block;vertical-align:middle;margin-left:10px}

  .section-title{font-size:15px;font-weight:600;margin:0 0 5px;display:flex;align-items:center;gap:8px}
  .section-sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px}

  /* ---------- Modal ---------- */
  .modal-back{position:fixed;inset:0;background:rgba(30,42,50,.42);display:none;place-items:center;padding:20px;z-index:40}
  .modal-back.show{display:grid}
  .modal{background:var(--surface);border-radius:18px;padding:28px;max-width:580px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.22)}
  .modal h3{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin-bottom:8px}
  .modal p{color:var(--ink-soft);font-size:14px;margin:0 0 16px}
  .modal textarea{width:100%;min-height:190px;padding:.8em;border:1px solid var(--line);border-radius:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;resize:vertical}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .import-msg{font-size:13.5px;margin-top:10px}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-size:15px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hidden{display:none !important}

  @media(max-width:600px){
    .app-root{padding:0 16px 80px}
    .list-row{flex-wrap:wrap}
    .list-row .row-actions{width:100%;justify-content:flex-end;border-top:1px solid var(--line-soft);padding-top:10px;margin-top:4px}
    .entry .personas{width:66px}
    .detail-date{font-size:26px}
  }

  /* ---------- Print (PDF) · escala de grises, una página ---------- */
  #printArea{display:none}
  @media print{
    @page{size:A4;margin:15mm 17mm}
    html,body{background:#fff}
    body > *:not(#printArea){display:none !important}
    #printArea{display:block;color:#000;font-family:'Inter',sans-serif;font-size:10pt;line-height:1.36;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}

    .pdf-head{text-align:center;margin-bottom:13pt;padding-bottom:9pt;border-bottom:1.3pt solid #000}
    .pdf-head .org{font-family:'Fraunces',serif;font-size:10pt;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
    .pdf-head .ttl{font-family:'Fraunces',serif;font-size:19pt;font-weight:500;margin-top:5pt;line-height:1.05}
    .pdf-head .meta{font-size:10pt;margin-top:6pt}

    .pdf-sec{margin-top:13pt}
    .pdf-sec > h4{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin:0;
      padding-bottom:3pt;border-bottom:.6pt solid #8a8a8a;display:flex;justify-content:space-between;align-items:baseline}
    .pdf-sec > h4 .c{font-weight:500;color:#555;letter-spacing:0;text-transform:none}
    .pdf-note{font-size:8pt;color:#666;margin:4pt 0 0}

    .pdf-cols{column-count:2;column-gap:20pt;margin-top:6pt}
    .pdf-cols .it{break-inside:avoid;display:flex;justify-content:space-between;gap:8pt;
      padding:2.2pt 0;border-bottom:.4pt dotted #b4b4b4;font-size:10pt}
    .pdf-cols .it .p{flex:none;color:#444;font-variant-numeric:tabular-nums}

    .pdf-na{margin-top:6pt}
    .pdf-na .it{break-inside:avoid;margin-bottom:6pt}
    .pdf-na .it .top{font-weight:600}
    .pdf-na .it .top .p{font-weight:400;color:#444}
    .pdf-na .it .ob{font-size:9pt;color:#222;margin-top:1pt;line-height:1.4}

    .pdf-free{font-size:9.5pt;line-height:1.5;margin-top:6pt}
    .pdf-none{font-size:9.5pt;color:#555;font-style:italic;margin-top:6pt}

    .pdf-foot{margin-top:16pt;padding-top:5pt;border-top:.5pt solid #8a8a8a;
      font-size:8pt;color:#555;display:flex;justify-content:space-between}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="login-mark">Parroquia de Santa Matilde</div>
    <h1>Reparto de alimentos</h1>
    <p class="sub">Registro de incidencias. Acceso restringido.</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div class="form-error" id="loginError"></div>
      <button class="btn primary" type="submit" id="loginBtn" style="width:100%;justify-content:center">Entrar</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app-root hidden" id="app">
  <div class="topbar">
    <div class="brand">
      <span class="name">Reparto de alimentos</span>
      <span class="place">Parroquia de Santa Matilde</span>
    </div>
    <div class="who">
      <span id="whoEmail"></span>
      <button class="btn ghost small" id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>

  <div class="alert-banner" id="alertBanner">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
    <span id="alertBannerText"></span>
  </div>

  <div class="tabs-wrap">
    <nav class="tabs">
      <button class="tab active" data-tab="repartos">Repartos</button>
      <button class="tab" data-tab="personas">Personas</button>
      <button class="tab" data-tab="analisis">Análisis <span class="count hidden" id="tabAlertCount"></span></button>
    </nav>
  </div>

  <div id="view"></div>
</div>

<!-- ============ IMPORT MODAL ============ -->
<div class="modal-back" id="importModal">
  <div class="modal">
    <h3>Importar histórico</h3>
    <p>Pega aquí los datos en formato JSON. Cada reparto se guarda por su fecha; si ya existe uno en esa fecha, se reemplaza.</p>
    <textarea id="importText" placeholder='[ { "fecha": "2023-12-16", "ausencias": [...], "noAlta": [...], "incidencias": "" } ]'></textarea>
    <div class="import-msg" id="importMsg"></div>
    <div class="modal-foot">
      <button class="btn" id="importCancel">Cancelar</button>
      <button class="btn primary" id="importRun">Importar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ============ PRINT AREA ============ -->
<div id="printArea"></div>

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {

    authDomain: "biblioteca-d0b28.firebaseapp.com",
    projectId: "biblioteca-d0b28",
    storageBucket: "biblioteca-d0b28.firebasestorage.app",
    messagingSenderId: "95243939121",
    appId: "1:95243939121:web:817e06db9d4abe1eb81410"
  };

  const ALLOWED_UID = "ZIZOg9PALVV2XDNx7OsnOwb74sh1";
  const STREAK_ALERT = 3;

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ---------- estado ----------
  let repartos = [];
  let currentTab = 'repartos';
  let editingFecha = null;

  const $ = (s,r=document)=>r.querySelector(s);
  const view = $('#view');
  view.addEventListener('click',e=>{ const rm=e.target.closest('.rm'); if(rm){ const en=rm.closest('.entry'); if(en) en.remove(); } });

  // ---------- helpers ----------
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const normKey = n => (n||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('es');
  const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const plural = n => n===1 ? '1 persona' : n+' personas';
  function fechaLarga(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); return `${d} de ${MESES[m-1]} de ${y}`; }
  function fechaCorta(iso){ const [y,m,d]=iso.split('-').map(Number); return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`; }
  let toastTimer;
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

  function nameIndex(){
    const map=new Map();
    for(const r of repartos){
      for(const a of (r.ausencias||[])){ const k=normKey(a.nombre); if(!k) continue; const e=map.get(k)||{display:a.nombre.trim(),count:0}; e.count++; map.set(k,e); }
      for(const a of (r.noAlta||[])){ const k=normKey(a.nombre); if(!k) continue; if(!map.has(k)) map.set(k,{display:a.nombre.trim(),count:0}); }
    }
    return map;
  }
  function refreshDatalist(){
    let dl=$('#nombresList');
    if(!dl){ dl=document.createElement('datalist'); dl.id='nombresList'; document.body.appendChild(dl); }
    const names=[...nameIndex().values()].map(e=>e.display).sort((a,b)=>a.localeCompare(b,'es'));
    dl.innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('');
  }
  function faltasDe(key,from,to){
    return repartos.filter(r=>(r.ausencias||[]).some(a=>normKey(a.nombre)===key))
      .filter(r=>(!from||r.fecha>=from)&&(!to||r.fecha<=to)).map(r=>r.fecha).sort();
  }
  function rachaActual(key){
    const asc=[...repartos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
    let streak=0; const fechas=[];
    for(let i=asc.length-1;i>=0;i--){
      const falto=(asc[i].ausencias||[]).some(a=>normKey(a.nombre)===key);
      if(falto){streak++;fechas.unshift(asc[i].fecha);} else break;
    }
    return {streak,fechas};
  }
  function rachaMax(key){
    const asc=[...repartos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
    let max=0,cur=0;
    for(const r of asc){ if((r.ausencias||[]).some(a=>normKey(a.nombre)===key)){cur++;max=Math.max(max,cur);} else cur=0; }
    return max;
  }
  function alertas(){
    const out=[];
    for(const [key,info] of nameIndex()){ const {streak,fechas}=rachaActual(key); if(streak>=STREAK_ALERT) out.push({key,display:info.display,streak,fechas}); }
    return out.sort((a,b)=>b.streak-a.streak || a.display.localeCompare(b.display,'es'));
  }
  function ranking(from,to){
    const counts=new Map();
    for(const r of repartos){
      if((from&&r.fecha<from)||(to&&r.fecha>to)) continue;
      for(const a of (r.ausencias||[])){ const k=normKey(a.nombre); if(!k) continue; const e=counts.get(k)||{display:a.nombre.trim(),n:0}; e.n++; counts.set(k,e); }
    }
    return [...counts.values()].sort((a,b)=>b.n-a.n || a.display.localeCompare(b.display,'es'));
  }

  // ---------- autenticación ----------
  onAuthStateChanged(auth, async user=>{
    if(user && user.uid===ALLOWED_UID){
      $('#loginScreen').classList.add('hidden');
      $('#app').classList.remove('hidden');
      $('#whoEmail').textContent=user.email||'';
      await loadRepartos();
    }else if(user){
      await signOut(auth);
      showLoginError('Esta cuenta no tiene acceso.');
    }else{
      $('#app').classList.add('hidden');
      $('#loginScreen').classList.remove('hidden');
    }
  });
  function showLoginError(m){ $('#loginError').textContent=m; }
  $('#loginForm').addEventListener('submit', async e=>{
    e.preventDefault(); showLoginError('');
    const btn=$('#loginBtn'); btn.disabled=true; btn.textContent='Entrando…';
    try{ await signInWithEmailAndPassword(auth, $('#email').value.trim(), $('#password').value); }
    catch(err){
      const code=err.code||'';
      showLoginError(
        code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found')
          ? 'Correo o contraseña incorrectos.'
          : code.includes('too-many-requests') ? 'Demasiados intentos. Espera un momento.'
          : 'No se ha podido entrar. Revisa la conexión.');
    }finally{ btn.disabled=false; btn.textContent='Entrar'; }
  });
  $('#logoutBtn').addEventListener('click',()=>signOut(auth));

  // ---------- carga ----------
  async function loadRepartos(){
    const snap=await getDocs(collection(db,'repartos'));
    repartos=snap.docs.map(d=>({
      fecha:d.id, ausencias:d.data().ausencias||[], noAlta:d.data().noAlta||[], incidencias:d.data().incidencias||''
    })).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    refreshDatalist(); updateAlertUI(); render();
  }
  function updateAlertUI(){
    const al=alertas(); const banner=$('#alertBanner'), badge=$('#tabAlertCount');
    if(al.length){
      banner.classList.add('show');
      $('#alertBannerText').innerHTML=`<strong>${al.length} ${al.length===1?'persona':'personas'}</strong> con ${STREAK_ALERT} o más faltas seguidas. Toca para revisar.`;
      badge.textContent=al.length; badge.classList.remove('hidden');
    }else{ banner.classList.remove('show'); badge.classList.add('hidden'); }
  }
  $('#alertBanner').addEventListener('click',()=>setTab('analisis'));

  // ---------- navegación ----------
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setTab(t.dataset.tab)));
  function setTab(tab){
    currentTab=tab; editingFecha=null;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
    render(); window.scrollTo({top:0,behavior:'smooth'});
  }
  function render(){
    if(currentTab==='repartos') renderRepartos();
    else if(currentTab==='personas') renderPersonas();
    else renderAnalisis();
  }

  // ---------- vista: REPARTOS (lista) ----------
  function renderRepartos(){
    view.innerHTML=`
      <div class="view-head">
        <h2>Repartos</h2>
        <div class="actions">
          <button class="btn small" id="importBtn">Importar histórico</button>
          <button class="btn primary small" id="newBtn">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Nuevo reparto
          </button>
        </div>
      </div>
      <div id="repartoList"></div>`;
    $('#newBtn').addEventListener('click',()=>openEditor(null));
    $('#importBtn').addEventListener('click',()=>$('#importModal').classList.add('show'));

    const list=$('#repartoList');
    if(!repartos.length){
      list.innerHTML=`<div class="empty"><h3>Aún no hay repartos</h3><p>Crea el primero con «Nuevo reparto», o importa el histórico de tus informes.</p></div>`;
      return;
    }
    list.innerHTML=`<div class="list">${repartos.map(r=>{
      const nf=(r.ausencias||[]).length, nn=(r.noAlta||[]).length;
      const stats=[ nf?`${nf} ${nf===1?'familia faltó':'familias faltaron'}`:'sin faltas',
        nn?`${nn} sin alta`:null, r.incidencias?.trim()?'otras incidencias':null ].filter(Boolean).join(' · ');
      return `<div class="list-row" data-f="${r.fecha}">
        <div class="meta"><div class="date">${fechaLarga(r.fecha)}</div><div class="stat">${stats}</div></div>
        <div class="row-actions">
          <button class="btn ghost small" data-act="pdf" data-f="${r.fecha}">PDF</button>
          <button class="btn danger small" data-act="del" data-f="${r.fecha}">Eliminar</button>
          <svg class="icon chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </div>`;
    }).join('')}</div>`;

    list.querySelectorAll('.list-row').forEach(row=>{
      row.addEventListener('click',e=>{
        const b=e.target.closest('[data-act]');
        if(b){ e.stopPropagation(); if(b.dataset.act==='pdf') printInforme(b.dataset.f); else delReparto(b.dataset.f); return; }
        openReparto(row.dataset.f);
      });
    });
  }

  // ---------- vista: REPARTO (lectura) ----------
  function openReparto(fecha){
    const r=repartos.find(x=>x.fecha===fecha); if(!r) return;
    editingFecha=null;
    const aus=r.ausencias||[], no=r.noAlta||[];
    const persAus=aus.reduce((s,a)=>s+(Number(a.personas)||0),0);
    view.innerHTML=`
      <button class="btn ghost back" id="backBtn"><svg class="icon" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg> Volver a repartos</button>
      <div class="detail-head">
        <div>
          <div class="detail-date">${fechaLarga(r.fecha)}</div>
          <div class="detail-sub">Reparto de alimentos · Parroquia de Santa Matilde</div>
        </div>
        <div class="detail-actions">
          <button class="btn" id="dEdit"><svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg> Editar</button>
          <button class="btn" id="dPdf">Exportar a PDF</button>
          <button class="btn danger" id="dDel">Eliminar</button>
        </div>
      </div>

      <section class="block">
        <div class="block-head"><h3>Familias que no vinieron</h3><span class="tag">${aus.length}</span>
          ${aus.length?`<span class="totals">${persAus} personas en total</span>`:''}</div>
        ${aus.length
          ? `<div class="namecols">${aus.map(a=>`<div class="nameitem"><span class="nm">${esc(a.nombre)}</span><span class="pc" title="personas">${a.personas}</span></div>`).join('')}</div>`
          : `<p class="muted">Ninguna.</p>`}
      </section>

      <section class="block">
        <div class="block-head"><h3>Personas sin estar dadas de alta</h3><span class="tag">${no.length}</span></div>
        ${no.length
          ? `<div class="noalta-list">${no.map(a=>`<div class="noalta-item"><div class="noalta-top"><span class="nm">${esc(a.nombre)}</span><span class="pc">${plural(a.personas)}</span></div>${a.observacion?`<div class="obs">${esc(a.observacion)}</div>`:''}</div>`).join('')}</div>`
          : `<p class="muted">Ninguna.</p>`}
      </section>

      ${r.incidencias?.trim()
        ? `<section class="block"><div class="block-head"><h3>Otras incidencias</h3></div><div class="freetext">${esc(r.incidencias).replace(/\n/g,'<br>')}</div></section>`
        : ''}`;
    $('#backBtn').addEventListener('click',renderRepartos);
    $('#dEdit').addEventListener('click',()=>openEditor(fecha));
    $('#dPdf').addEventListener('click',()=>printInforme(fecha));
    $('#dDel').addEventListener('click',()=>delReparto(fecha));
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // ---------- editor ----------
  function entryRowAusencia(nombre='',personas=1){
    return `<div class="entry" data-kind="aus">
      <input class="row-input" list="nombresList" placeholder="Nombre de la familia" value="${esc(nombre)}">
      <input class="personas" type="number" min="1" step="1" value="${personas||1}" aria-label="Nº de personas">
      <button class="rm" title="Quitar" type="button"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>`;
  }
  function entryRowNoAlta(nombre='',personas=1,obs=''){
    return `<div class="entry with-note" data-kind="noalta">
      <input class="row-input" list="nombresList" placeholder="Nombre" value="${esc(nombre)}">
      <input class="personas" type="number" min="1" step="1" value="${personas||1}" aria-label="Nº de personas">
      <button class="rm" title="Quitar" type="button"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <textarea class="obs" placeholder="Observación (opcional)">${esc(obs)}</textarea>
    </div>`;
  }
  function openEditor(fecha){
    editingFecha=fecha;
    const r = fecha ? repartos.find(x=>x.fecha===fecha) : null;
    const hoy = new Date().toISOString().slice(0,10);
    view.innerHTML=`
      <div class="editor">
        <h2>${r?'Editar reparto':'Nuevo reparto'}</h2>
        <p class="lead">${r?fechaLarga(r.fecha):'Registra las incidencias del reparto.'}</p>
        <fieldset>
          <legend>Fecha del reparto</legend>
          <input type="date" class="date-input" id="fFecha" value="${r?r.fecha:hoy}">
        </fieldset>
        <fieldset>
          <legend>Familias dadas de alta que no vinieron</legend>
          <div class="hint">Empieza a escribir y se sugerirán nombres ya registrados, para reutilizarlos.</div>
          <div class="col-label"><span class="l-name">Nombre</span><span class="l-num">Personas</span><span class="l-sp"></span></div>
          <div class="rows" id="rowsAus"></div>
          <button class="btn small" type="button" id="addAus">+ Añadir familia</button>
        </fieldset>
        <fieldset>
          <legend>Personas que vinieron sin estar dadas de alta</legend>
          <div class="hint">Con una observación si hace falta (por ejemplo, si se le pidió pasar por el despacho).</div>
          <div class="rows" id="rowsNoAlta"></div>
          <button class="btn small" type="button" id="addNoAlta">+ Añadir persona</button>
        </fieldset>
        <fieldset>
          <legend>Otras incidencias</legend>
          <textarea class="incidencias" id="fIncidencias" placeholder="Cualquier otra incidencia del reparto.">${esc(r?.incidencias||'')}</textarea>
        </fieldset>
        <div class="editor-foot">
          <button class="btn danger" type="button" id="cancelEdit">Cancelar</button>
          <span class="spacer"></span>
          <button class="btn primary" type="button" id="saveEdit">Guardar reparto</button>
        </div>
      </div>`;
    const rowsAus=$('#rowsAus'), rowsNo=$('#rowsNoAlta');
    if(r && r.ausencias.length) rowsAus.innerHTML=r.ausencias.map(a=>entryRowAusencia(a.nombre,a.personas)).join('');
    else rowsAus.insertAdjacentHTML('beforeend',entryRowAusencia());
    if(r && r.noAlta.length) rowsNo.innerHTML=r.noAlta.map(a=>entryRowNoAlta(a.nombre,a.personas,a.observacion)).join('');
    $('#addAus').addEventListener('click',()=>{ rowsAus.insertAdjacentHTML('beforeend',entryRowAusencia()); rowsAus.lastElementChild.querySelector('.row-input').focus(); });
    $('#addNoAlta').addEventListener('click',()=>{ rowsNo.insertAdjacentHTML('beforeend',entryRowNoAlta()); rowsNo.lastElementChild.querySelector('.row-input').focus(); });
    $('#cancelEdit').addEventListener('click',()=>{ if(r) openReparto(fecha); else { editingFecha=null; renderRepartos(); } });
    $('#saveEdit').addEventListener('click',saveReparto);
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function collectRows(container){
    return [...container.querySelectorAll('.entry')].map(el=>{
      const nombre=el.querySelector('.row-input').value.trim();
      const personas=parseInt(el.querySelector('.personas').value,10)||1;
      const obsEl=el.querySelector('.obs');
      const o={nombre,personas}; if(obsEl) o.observacion=obsEl.value.trim(); return o;
    }).filter(x=>x.nombre);
  }
  async function saveReparto(){
    const fecha=$('#fFecha').value;
    if(!fecha){ toast('Falta la fecha del reparto.'); return; }
    const ausencias=collectRows($('#rowsAus'));
    const noAlta=collectRows($('#rowsNoAlta'));
    const incidencias=$('#fIncidencias').value.trim();
    const existe=repartos.some(r=>r.fecha===fecha && r.fecha!==editingFecha);
    if(existe && !confirm('Ya existe un reparto en esa fecha. ¿Reemplazarlo con estos datos?')) return;
    const btn=$('#saveEdit'); btn.disabled=true; btn.textContent='Guardando…';
    try{
      await setDoc(doc(db,'repartos',fecha),{ausencias,noAlta,incidencias,actualizado:serverTimestamp()});
      if(editingFecha && editingFecha!==fecha) await deleteDoc(doc(db,'repartos',editingFecha));
      editingFecha=null;
      await loadRepartos();
      openReparto(fecha);
      toast('Reparto guardado.');
    }catch(err){ btn.disabled=false; btn.textContent='Guardar reparto'; toast('No se ha podido guardar. Revisa la conexión.'); }
  }
  async function delReparto(fecha){
    if(!confirm(`¿Eliminar el reparto del ${fechaLarga(fecha)}? Esta acción no se puede deshacer.`)) return;
    try{ await deleteDoc(doc(db,'repartos',fecha)); await loadRepartos(); toast('Reparto eliminado.'); }
    catch(err){ toast('No se ha podido eliminar.'); }
  }

  // ---------- vista: PERSONAS ----------
  let personaSel={key:'',display:'',from:'',to:''};
  function renderPersonas(){
    view.innerHTML=`
      <div class="view-head"><h2>Personas</h2></div>
      <div class="panel">
        <div class="search-bar">
          <div class="field grow"><label for="pName">Nombre</label>
            <input id="pName" list="nombresList" placeholder="Escribe un nombre" value="${esc(personaSel.display)}"></div>
          <div class="range">
            <div class="field"><label for="pFrom">Desde</label><input type="date" class="date-input" id="pFrom" value="${personaSel.from}"></div>
            <div class="field"><label for="pTo">Hasta</label><input type="date" class="date-input" id="pTo" value="${personaSel.to}"></div>
          </div>
          <div class="field"><button class="btn primary" id="pGo">Ver histórico</button></div>
        </div>
      </div>
      <div id="fichaBox"></div>`;
    const go=()=>{ personaSel={key:normKey($('#pName').value),display:$('#pName').value.trim(),from:$('#pFrom').value,to:$('#pTo').value}; renderFicha(); };
    $('#pGo').addEventListener('click',go);
    $('#pName').addEventListener('change',go);
    $('#pName').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    if(personaSel.key) renderFicha();
  }
  function renderFicha(){
    const box=$('#fichaBox'); if(!box) return;
    if(!personaSel.key){ box.innerHTML=''; return; }
    const idx=nameIndex().get(personaSel.key);
    const display=idx?idx.display:personaSel.display;
    const fechas=faltasDe(personaSel.key,personaSel.from,personaSel.to);
    const rActual=rachaActual(personaSel.key).streak;
    const rMax=rachaMax(personaSel.key);
    if(!idx){ box.innerHTML=`<div class="empty"><h3>Sin registros</h3><p>No hay ninguna persona con ese nombre en los repartos guardados.</p></div>`; return; }
    const rango = (personaSel.from||personaSel.to)
      ? `Del ${personaSel.from?fechaCorta(personaSel.from):'inicio'} al ${personaSel.to?fechaCorta(personaSel.to):'hoy'}` : 'Todo el histórico';
    box.innerHTML=`
      <div class="panel ficha">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div class="fname">${esc(display)}</div>
          <button class="btn small" id="fichaPdf">Exportar ficha a PDF</button>
        </div>
        <div class="stats">
          <div class="stat-card"><div class="n">${fechas.length}</div><div class="k">faltas en el periodo</div></div>
          <div class="stat-card"><div class="n ${rActual>=STREAK_ALERT?'warn':''}">${rActual}</div><div class="k">faltas seguidas ahora</div></div>
          <div class="stat-card"><div class="n">${rMax}</div><div class="k">máximo seguidas</div></div>
        </div>
        <div class="section-sub">${rango}</div>
        ${fechas.length ? `<ul class="date-list">${fechas.map(f=>`<li>${fechaLarga(f)}</li>`).join('')}</ul>` : `<div class="section-sub">No faltó ninguna vez en este periodo.</div>`}
      </div>`;
    $('#fichaPdf').addEventListener('click',()=>printFicha(personaSel.key));
  }

  // ---------- vista: ANÁLISIS ----------
  let rankRange={from:'',to:''};
  function renderAnalisis(){
    const al=alertas();
    view.innerHTML=`
      <div class="view-head"><h2>Análisis</h2></div>
      <div class="panel">
        <div class="section-title">
          <svg class="icon" viewBox="0 0 24 24" style="stroke:var(--warn)"><path d="M12 9v4m0 4h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
          Faltas seguidas
        </div>
        <p class="section-sub">Personas que han faltado en los ${STREAK_ALERT} últimos repartos consecutivos o más. Agosto no rompe la racha, porque no hay reparto.</p>
        <div id="alertList"></div>
      </div>
      <div class="panel">
        <div class="section-title">Quién más falta</div>
        <div class="search-bar" style="margin-bottom:18px">
          <div class="range">
            <div class="field"><label for="rFrom">Desde</label><input type="date" class="date-input" id="rFrom" value="${rankRange.from}"></div>
            <div class="field"><label for="rTo">Hasta</label><input type="date" class="date-input" id="rTo" value="${rankRange.to}"></div>
          </div>
          <div class="field"><button class="btn" id="rGo">Aplicar periodo</button></div>
        </div>
        <div id="rankBox"></div>
      </div>`;
    const alBox=$('#alertList');
    alBox.innerHTML = al.length
      ? al.map(a=>`<div class="alert-card">
          <div><div class="name">${esc(a.display)}</div>
          <div class="runs">Desde el ${fechaCorta(a.fechas[0])} · ${a.fechas.length} repartos seguidos</div></div>
          <div class="streak">${a.streak}<small>seguidas</small></div></div>`).join('')
      : `<div class="section-sub">Nadie acumula ${STREAK_ALERT} faltas seguidas ahora mismo.</div>`;
    $('#rGo').addEventListener('click',()=>{ rankRange={from:$('#rFrom').value,to:$('#rTo').value}; renderRank(); });
    renderRank();
  }
  function renderRank(){
    const box=$('#rankBox'); if(!box) return;
    const data=ranking(rankRange.from,rankRange.to);
    if(!data.length){ box.innerHTML=`<div class="section-sub">Sin faltas registradas en este periodo.</div>`; return; }
    const max=data[0].n;
    box.innerHTML=`<table class="rank"><thead><tr><th>Persona</th><th style="text-align:right">Faltas</th></tr></thead><tbody>
      ${data.map(d=>`<tr><td>${esc(d.display)}<span class="rank-bar" style="width:${Math.round(70*d.n/max)}px"></span></td><td class="num">${d.n}</td></tr>`).join('')}
    </tbody></table>`;
  }

  // ---------- IMPORTAR ----------
  $('#importCancel').addEventListener('click',()=>{ $('#importModal').classList.remove('show'); $('#importMsg').textContent=''; });
  $('#importModal').addEventListener('click',e=>{ if(e.target.id==='importModal') e.target.classList.remove('show'); });
  $('#importRun').addEventListener('click',async ()=>{
    const msg=$('#importMsg'); msg.style.color='var(--danger)';
    let data;
    try{ data=JSON.parse($('#importText').value); } catch{ msg.textContent='El texto no es un JSON válido.'; return; }
    if(!Array.isArray(data)){ msg.textContent='Se esperaba una lista de repartos.'; return; }
    const btn=$('#importRun'); btn.disabled=true; btn.textContent='Importando…';
    let ok=0,fail=0;
    for(const r of data){
      if(!r || !r.fecha){ fail++; continue; }
      try{ await setDoc(doc(db,'repartos',r.fecha),{
        ausencias:Array.isArray(r.ausencias)?r.ausencias:[], noAlta:Array.isArray(r.noAlta)?r.noAlta:[],
        incidencias:r.incidencias||'', actualizado:serverTimestamp() }); ok++; }
      catch{ fail++; }
    }
    btn.disabled=false; btn.textContent='Importar';
    msg.style.color=fail?'var(--danger)':'var(--primary)';
    msg.textContent=`Importados ${ok} repartos${fail?`, ${fail} con error`:''}.`;
    await loadRepartos();
    if(!fail){ setTimeout(()=>{ $('#importModal').classList.remove('show'); msg.textContent=''; $('#importText').value=''; },1200); }
  });

  // ---------- PDF ----------
  function printInforme(fecha){
    const r=repartos.find(x=>x.fecha===fecha); if(!r) return;
    const aus=(r.ausencias||[]), no=(r.noAlta||[]);
    const persAus=aus.reduce((s,a)=>s+(Number(a.personas)||0),0);
    $('#printArea').innerHTML=`
      <div class="pdf-head">
        <div class="org">Parroquia de Santa Matilde</div>
        <div class="ttl">Informe de incidencias</div>
        <div class="meta">Reparto de alimentos · ${fechaLarga(r.fecha)}</div>
      </div>
      <div class="pdf-sec">
        <h4><span>Familias que no vinieron estando dadas de alta</span><span class="c">${aus.length} ${aus.length===1?'familia':'familias'} · ${persAus} personas</span></h4>
        ${aus.length
          ? `<p class="pdf-note">La cifra a la derecha de cada nombre indica el nº de personas de la familia.</p>
             <div class="pdf-cols">${aus.map(a=>`<div class="it"><span class="n">${esc(a.nombre)}</span><span class="p">${a.personas}</span></div>`).join('')}</div>`
          : `<p class="pdf-none">Ninguna.</p>`}
      </div>
      <div class="pdf-sec">
        <h4><span>Personas que vinieron sin estar dadas de alta</span><span class="c">${no.length}</span></h4>
        ${no.length
          ? `<div class="pdf-na">${no.map(a=>`<div class="it"><div class="top">${esc(a.nombre)} <span class="p">(${plural(a.personas)})</span></div>${a.observacion?`<div class="ob">${esc(a.observacion)}</div>`:''}</div>`).join('')}</div>`
          : `<p class="pdf-none">Ninguna.</p>`}
      </div>
      ${r.incidencias?.trim()?`<div class="pdf-sec"><h4><span>Otras incidencias</span></h4><div class="pdf-free">${esc(r.incidencias).replace(/\n/g,'<br>')}</div></div>`:''}
      <div class="pdf-foot"><span>Parroquia de Santa Matilde · Registro de repartos</span><span>Generado el ${fechaCorta(new Date().toISOString().slice(0,10))}</span></div>`;
    window.print();
  }
  function printFicha(key){
    const idx=nameIndex().get(key); if(!idx) return;
    const fechas=faltasDe(key,personaSel.from,personaSel.to);
    const rango=(personaSel.from||personaSel.to)
      ? `Periodo: del ${personaSel.from?fechaCorta(personaSel.from):'inicio'} al ${personaSel.to?fechaCorta(personaSel.to):'hoy'}`
      : 'Periodo: todo el histórico';
    $('#printArea').innerHTML=`
      <div class="pdf-head">
        <div class="org">Parroquia de Santa Matilde</div>
        <div class="ttl">Ficha de faltas</div>
        <div class="meta">${esc(idx.display)}</div>
      </div>
      <div class="pdf-sec">
        <h4><span>Resumen</span></h4>
        <div class="pdf-free">${rango}.<br>Total de faltas: <strong>${fechas.length}</strong> · Máximo de faltas seguidas: <strong>${rachaMax(key)}</strong>.</div>
      </div>
      <div class="pdf-sec">
        <h4><span>Fechas en las que faltó</span><span class="c">${fechas.length}</span></h4>
        ${fechas.length
          ? `<div class="pdf-cols">${fechas.map(f=>`<div class="it"><span class="n">${fechaLarga(f)}</span></div>`).join('')}</div>`
          : `<p class="pdf-none">No faltó ninguna vez en este periodo.</p>`}
      </div>
      <div class="pdf-foot"><span>Parroquia de Santa Matilde · Registro de repartos</span><span>Generado el ${fechaCorta(new Date().toISOString().slice(0,10))}</span></div>`;
    window.print();
  }
</script>
</body>
</html>
